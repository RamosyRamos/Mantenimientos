<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F1112" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ramos y Ramos | Mantenimiento</title>
    <!-- Tema B (feat/tema-b-mantenimientos): IBM Plex Sans para la interfaz y
         IBM Plex Mono para placas, km, litros, fechas y fracciones. La CSP de
         vercel.json ya permite fonts.googleapis.com y fonts.gstatic.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── TEMA OSCURO (por defecto) ── valores de los tokens del tema B
         (src/theme/tokensB.js): bg, panel, border, text, textMuted,
         textSoft, accent, shell, card, field, textDisabled. */
      :root, [data-theme="dark"] {
        --bg:       #0B0B0D;
        --card:     #191C1E;
        --line:     #25282A;
        --text:     #F2F0EB;
        --sub:      #8A8D90;
        --sub2:     #ABA9A4;
        --gold:     #C8A96E;
        --header:   #0F1112;
        --datos:    #202325;
        --inp-bg:   #141719;
        --inp-text: #F2F0EB;
        --inp-ph:   #5C6064;
        --card-txt: #ABA9A4;
      }

      /* ── TEMA CLARO ── */
      [data-theme="light"] {
        --bg:       #f2f0eb;
        --card:     #ffffff;
        --line:     #dedad4;
        --text:     #1a1a1a;
        --sub:      #777777;
        --sub2:     #999999;
        --gold:     #9a6f2e;
        --header:   #ffffff;
        --datos:    #f8f6f2;
        --inp-bg:   #ffffff;
        --inp-text: #1a1a1a;
        --inp-ph:   #aaaaaa;
        --card-txt: #444444;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        transition: background 0.2s, color 0.2s;
      }
      #root { min-height: 100vh; }

      /* Inputs heredan el tema (las casillas no: llevan accent-color). El borde
         ya no va con !important: un campo con error lo pinta en crit inline. */
      input:not([type=checkbox]):not([type=radio]), select, textarea {
        background: var(--inp-bg) !important;
        color: var(--inp-text) !important;
        border-color: rgba(255,255,255,0.08);
        color-scheme: dark;
      }
      /* Foco del tema B, solo en la app interna (las vistas del cliente tienen el suyo). */
      input:not(#history-root *):focus, select:not(#history-root *):focus, textarea:not(#history-root *):focus {
        border-color: rgba(200,169,110,0.55) !important;
        box-shadow: 0 0 0 3px rgba(200,169,110,0.12);
        outline: none;
      }
      input::placeholder, textarea::placeholder {
        color: var(--inp-ph) !important;
      }
      select option {
        background: var(--inp-bg);
        color: var(--inp-text);
      }

      /* Transiciones suaves */
      #root { transition: filter 0.2s; }

      /* ── ESTILOS DE IMPRESIÓN ── */
      @media print {
        body { background: #fff !important; color: #000 !important; }
        #root { filter: none !important; }
        button { display: none !important; }
        a { color: #000 !important; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }

      /* ── TEMA CLARO: inversión de colores ── */
      [data-theme="light"] #root {
        filter: invert(1) hue-rotate(180deg);
      }
      /* Re-invertir imágenes y canvas para que se vean normales */
      [data-theme="light"] #root img,
      [data-theme="light"] #root canvas {
        filter: invert(1) hue-rotate(180deg);
      }

      /* ── MOBILE OPTIMIZATION ─────────────────────────────────────────────── */
      @media (max-width: 768px) {
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body { overflow-x: hidden; }

        /* Prevent double-tap zoom and iOS tap highlight */
        button, a, label, [role="button"] {
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
        }

        /* Tactile active feedback */
        button:active { opacity: 0.72 !important; transform: scale(0.985); }

        /* iOS input zoom prevention — MUST be ≥16px (el código de ingreso va más grande) */
        input:not([data-campo-grande]), select, textarea { font-size: 16px !important; }

        /* Minimum 44px touch targets (tema B: campos de 44) */
        button { min-height: 44px; }
        input:not([type=checkbox]):not([type=radio]), select { min-height: 44px; }
        textarea { min-height: 80px; }

        /* Sticky primary action bar (used on step 1, 2, checklist, notes) */
        .sticky-action {
          position: sticky;
          bottom: 0;
          background: var(--header);
          padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
          border-top: 1px solid rgba(255,255,255,0.05);
          z-index: 8;
          margin-top: 8px;
        }

        /* Recent panel full-width on mobile */
        .recent-panel-inner {
          width: 100vw !important;
          max-width: 100vw !important;
        }

        /* Checklist (OK / hallazgo / N/A) y códigos de servicio: 44 de lado
           (tema B: el tamaño lo da cada control). */
        .chk-btn, .svc-btn { min-height: 44px !important; }

        /* Login screen: full-width inputs and button */
        .login-input { width: 100% !important; }
        .login-btn   { width: 100% !important; min-height: 48px !important; font-size: 15px !important; }
      }

    </style>
    <script>
      // Restaurar tema guardado antes de que React cargue — SOLO en la app
      // interna: /servicio y /historial son claras y el invert las rompe
      // (mismo scoping que el restore de main.jsx).
      try {
        var p = window.location.pathname;
        var esVistaCliente = p.indexOf('/servicio/') === 0 || p === '/historial' || p === '/cliente';
        if (!esVistaCliente && localStorage.getItem('theme') === 'light') {
          document.addEventListener('DOMContentLoaded', () => {
            const root = document.getElementById('root');
            if (root) { root.style.filter = 'invert(1) hue-rotate(180deg)'; }
          });
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
